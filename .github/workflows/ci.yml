name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        id: app-token
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Android SDK setup
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Run Android Lint and Detekt
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :app:lintDebug :app:detekt

      - name: Run tests and verify coverage
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :buildSrc:test :app:checkCoverageBaseline

      - name: Update and Push Coverage Baseline
        if: github.ref == 'refs/heads/main'
        run: |
          if [[ -n $(git status --porcelain .github/coverage-baseline.txt) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/coverage-baseline.txt
            git commit -m "chore: update coverage baseline [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No changes in coverage baseline."
          fi

      - name: Check commit message for release criteria
        if: github.ref == 'refs/heads/main'
        id: check_commit
        run: |
          commit_subject=$(git log -1 --pretty=%s $GITHUB_SHA)
          commit_body=$(git log -1 --pretty=%b $GITHUB_SHA)
          echo "Commit subject: $commit_subject"
          
          is_breaking=false
          if echo "$commit_subject" | grep -qE '^(feat|fix|refactor)(\(.*\))?!:|\[BREAKING\]' || echo "$commit_body" | grep -qE '^BREAKING[- ]CHANGE:'; then
            is_breaking=true
          fi

          if [ "$is_breaking" = true ] || echo "$commit_subject" | grep -qE '^(feat|fix|refactor)(\(.*\))?:'; then
            echo "should_release=true" >> $GITHUB_ENV
            echo "Matches release criteria."
            
            git fetch --tags origin
            prev_tag=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || echo "v0.0.0")
            echo "prev_tag=$prev_tag" >> $GITHUB_ENV
            
            version=${prev_tag#v}
            version=${version%%-*}
            version=${version%%+*}
            
            IFS='.' read -r major minor patch <<< "$version" || true
            
            major=$(echo "$major" | grep -oE '^[0-9]+' || echo "0")
            minor=$(echo "$minor" | grep -oE '^[0-9]+' || echo "0")
            patch=$(echo "$patch" | grep -oE '^[0-9]+' || echo "0")
            
            major=$((10#$major))
            minor=$((10#$minor))
            patch=$((10#$patch))
            
            if [ "$is_breaking" = true ]; then
              major=$((major + 1))
              minor=0
              patch=0
            elif echo "$commit_subject" | grep -qE '^(feat|refactor)(\(.*\))?:'; then
              minor=$((minor + 1))
              patch=0
            elif echo "$commit_subject" | grep -qE '^fix(\(.*\))?:'; then
              patch=$((patch + 1))
            fi
            
            new_version="$major.$minor.$patch"
            new_tag="v$new_version"
            echo "new_version=$new_version" >> $GITHUB_ENV
            echo "new_tag=$new_tag" >> $GITHUB_ENV
            echo "New version: $new_tag"
          else
            echo "should_release=false" >> $GITHUB_ENV
            echo "Does not match release criteria."
          fi

      - name: Decode Keystore
        if: github.ref == 'refs/heads/main' && env.should_release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.keystore
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.keystore/upload-keystore.jks

      - name: Build productive release APK
        if: github.ref == 'refs/heads/main' && env.should_release == 'true'
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease -PversionName=${{ env.new_version }} -PversionCode=${{ github.run_number }}

      - name: Generate Release Notes
        if: github.ref == 'refs/heads/main' && env.should_release == 'true'
        run: |
          kotlinc -script .github/scripts/generate_release_notes.kts

      - name: Generate Karoo Store Manifest
        if: github.ref == 'refs/heads/main' && env.should_release == 'true'
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :app:generateManifest -PversionName=${{ env.new_version }} -PversionCode=${{ github.run_number }} -PreleaseNotesFile=release_notes.md

      - name: Validate Karoo Store Release Artifacts
        if: github.ref == 'refs/heads/main' && env.should_release == 'true'
        run: |
          manifest="app/build/outputs/manifest/manifest.json"
          apk="app/build/outputs/apk/release/app-release.apk"

          jq empty "$manifest"
          jq -e 'has("tags") | not' "$manifest" >/dev/null
          jq -er '.releaseNotes | length > 0' "$manifest" >/dev/null

          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          tools=$(ls -d "$sdk"/build-tools/* 2>/dev/null | sort -V | tail -1)
          aapt2="$tools/aapt2"
          test -x "$aapt2"

          badging=$("$aapt2" dump badging "$apk")
          badging_line=${badging%%$'\n'*}
          extract_badging() {
            awk -v key="$2" '{ if (match($0, key "=\047[^\047]*\047")) { print substr($0, RSTART + length(key) + 2, RLENGTH - length(key) - 3) } }' <<< "$1"
          }

          apk_pkg=$(extract_badging "$badging_line" "name")
          apk_ver=$(extract_badging "$badging_line" "versionName")
          apk_code=$(extract_badging "$badging_line" "versionCode")

          test -n "$apk_pkg"
          test -n "$apk_ver"
          test -n "$apk_code"

          man_pkg=$(jq -r '.packageName' "$manifest")
          man_ver=$(jq -r '.latestVersion' "$manifest")
          man_code=$(jq -r '.latestVersionCode' "$manifest")

          test "$apk_pkg" = "$man_pkg"
          test "$apk_ver" = "$man_ver"
          test "$apk_code" = "$man_code"
          test -f "docs/images/karoo-forumslader.png"

          while IFS= read -r url; do
            file_name="${url##*/}"
            test -f "docs/images/screenshots/$file_name"
          done < <(jq -r '.screenshotUrls[]' "$manifest")

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && env.should_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.new_tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ env.new_tag }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/manifest/manifest.json
            docs/images/karoo-forumslader.png
            docs/images/screenshots/card-*.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
